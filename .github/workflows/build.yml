name: Build Rust Project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test

  build:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install aarch64-linux-gnu linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Build (release)
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            *-musl)
              HOST_TRIPLE="$(rustc -vV | awk '/^host:/{print $2}')"
              RUST_LLD="$(rustc --print sysroot)/lib/rustlib/${HOST_TRIPLE}/bin/rust-lld"
              export RUSTFLAGS="-C linker-flavor=ld.lld -C linker=${RUST_LLD}"
              ;;
            aarch64-unknown-linux-gnu)
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="aarch64-linux-gnu-gcc"
              ;;
          esac
          cargo build --release --target "${{ matrix.target }}"
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: iptv-rs-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/iptv-rs
          retention-days: 7
    
